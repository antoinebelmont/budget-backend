services:
  app:
    build:
      context: ./src
      dockerfile: Dockerfile
    image: ynab_clone_app
    container_name: ynab_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    env_file:
      - ./src/.env
    environment:
      DB_HOST: db
      DB_DATABASE: ynab
      DB_USERNAME: ynab
      DB_PASSWORD: secret
      REDIS_HOST: redis
    command: sh -c "composer install --no-interaction --optimize-autoloader && chmod -R 777 storage bootstrap/cache && php-fpm"
    ports:
      - "9000:9000"
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
  webserver:
    build:
      context: ./infra/nginx
      dockerfile: Dockerfile
    image: ynab_clone_nginx
    container_name: ynab_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html:ro
      - ./infra/nginx/conf:/etc/nginx/conf.d:ro
    depends_on:
      - app
  db:
    image: mysql:8.0
    container_name: ynab_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ynab
      MYSQL_USER: ynab
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
  redis:
    image: redis:7-alpine
    container_name: ynab_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
  node:
    image: node:20-alpine
    container_name: ynab_node
    working_dir: /usr/src/app
    volumes:
      - ../fe:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8080/api
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    depends_on:
      - webserver
volumes:
  dbdata:
  redisdata: